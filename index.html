    <script>
        // Web Audio API for cute interaction sounds
        let audioCtx = null;
        let isSoundEnabled = true;

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const soundIcon = document.getElementById('soundIcon');
            const soundText = document.getElementById('soundText');
            if (isSoundEnabled) {
                soundIcon.textContent = '🔊';
                soundText.textContent = 'เปิดเสียง';
                showToast("เปิดเสียงเรียบร้อย");
            } else {
                soundIcon.textContent = '🔇';
                soundText.textContent = 'ปิดเสียง';
                showToast("ปิดเสียงเรียบร้อย");
            }
        }

        function initAudio() {
            if (!audioCtx && isSoundEnabled) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playPopSound() {
            if (!isSoundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        function playTickSound() {
            if (!isSoundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

            { id: 197, name: "แกงไก่ใบยี่หร่า", meat: "chicken", category: "side", spicy: "spicy", emoji: "🍛" },

            { id: 200, name: "ไชโป๊วผัดไข่", meat: "veggie", category: "side", spicy: "non-spicy", emoji: "🍳" },
            { id: 201, name: "หมูผัดกะปิ", meat: "pork", category: "side", spicy: "spicy", emoji: "🥓" },
            { id: 202, name: "ยำรวมมิตร", meat: "seafood", category: "side", spicy: "spicy", emoji: "🥗" },
            { id: 203, name: "น้ำพริกหมูผัด", meat: "pork", category: "side", spicy: "spicy", emoji: "🌶️" },
            { id: 204, name: "ปลานิลทอดแดดเดียว", meat: "fish", category: "side", spicy: "non-spicy", emoji: "🐟" },
            { id: 205, name: "เย็นตาโฟ", meat: "seafood", category: "noodle", spicy: "non-spicy", emoji: "🍜" }
        ];

        let selectedFilters = {
            meat: ['all'],
            category: ['all'],
            spicy: ['all']
        };

        let isSpinning = false;

        function toggleFilter(type, value) {
            if (value === 'all') {
                selectedFilters[type] = ['all'];
            } else {
                selectedFilters[type] = selectedFilters[type].filter(item => item !== 'all');
                
                const index = selectedFilters[type].indexOf(value);
                if (index > -1) {
                    selectedFilters[type].splice(index, 1);
                } else {
                    selectedFilters[type].push(value);
                }

                if (selectedFilters[type].length === 0) {
                    selectedFilters[type] = ['all'];
                }
            }

            updateFilterButtonStyles(type);
            updateHeaderBadges();
            updateMatchCount();
        }

        function updateFilterButtonStyles(type) {
            const buttons = document.querySelectorAll(`button[data-type="${type}"]`);
            buttons.forEach(btn => {
                const val = btn.getAttribute('data-val');
                const isSelected = selectedFilters[type].includes(val);

                if (isSelected) {
                    btn.classList.add('active');
                    if (type === 'meat') {
                        btn.className = "filter-btn active flex items-center justify-center p-2.5 rounded-2xl border-2 border-brand-red bg-brand-red/10 text-brand-red font-medium transition active:scale-95 text-xs font-kanit";
                    } else if (type === 'category') {
                        btn.className = "filter-btn active flex items-center justify-center p-2.5 rounded-2xl border-2 border-brand-yellow bg-brand-yellow/30 text-stone-900 font-medium transition active:scale-95 text-xs font-kanit";
                    } else if (type === 'spicy') {
                        btn.className = "filter-btn active flex items-center justify-center p-2.5 rounded-2xl border-2 border-brand-green bg-brand-green/15 text-brand-green-dark font-medium transition active:scale-95 text-xs font-kanit";
                    }
                } else {
                    btn.classList.remove('active');
                    if (type === 'meat') {
                        btn.className = "filter-btn flex items-center justify-center p-2.5 rounded-2xl border-2 border-stone-200 bg-white hover:border-brand-red/60 text-stone-700 font-medium transition active:scale-95 text-xs font-kanit";
                    } else if (type === 'category') {
                        btn.className = "filter-btn flex items-center justify-center p-2.5 rounded-2xl border-2 border-stone-200 bg-white hover:border-brand-yellow text-stone-700 font-medium transition active:scale-95 text-xs font-kanit";
                    } else if (type === 'spicy') {
                        btn.className = "filter-btn flex items-center justify-center p-2.5 rounded-2xl border-2 border-stone-200 bg-white hover:border-brand-green text-stone-700 font-medium transition active:scale-95 text-xs font-kanit";
                    }
                }
            });
        }

        function updateHeaderBadges() {
            const meatNames = {
                all: 'ทานได้ทุกอย่าง',
                pork: 'หมู',
                chicken: 'ไก่',
                beef: 'วัว',
                fish: 'ปลา',
                seafood: 'ทะเล',
                veggie: 'มังสวิรัติ'
            };
            const catNames = {
                all: 'ทานได้ทุกแบบ',
                single: 'ข้าว/จานเดียว',
                noodle: 'ก๋วยเตี๋ยว/เส้น',
                side: 'กับข้าว'
            };
            const spicyNames = {
                all: 'รสไหนก็ได้',
                spicy: 'เผ็ดแซ่บ',
                'non-spicy': 'ไม่เผ็ด'
            };

            let meatText = 'ทานได้ทุกอย่าง';
            if (!selectedFilters.meat.includes('all')) {
                meatText = selectedFilters.meat.map(m => meatNames[m]).join(', ');
            }

            let catText = 'ทานได้ทุกแบบ';
            if (!selectedFilters.category.includes('all')) {
                catText = selectedFilters.category.map(c => catNames[c]).join(', ');
            }

            let spicyText = 'รสไหนก็ได้';
            if (!selectedFilters.spicy.includes('all')) {
                spicyText = selectedFilters.spicy.map(s => spicyNames[s]).join(', ');
            }

            document.getElementById('selectedMeatBadge').textContent = meatText;
            document.getElementById('selectedCategoryBadge').textContent = catText;
            document.getElementById('selectedSpicyBadge').textContent = spicyText;
        }

        function resetFilters() {
            selectedFilters.meat = ['all'];
            selectedFilters.category = ['all'];
            selectedFilters.spicy = ['all'];
            
            updateFilterButtonStyles('meat');
            updateFilterButtonStyles('category');
            updateFilterButtonStyles('spicy');
            
            updateHeaderBadges();
            updateMatchCount();
            showToast("รีเซ็ตตัวเลือกทั้งหมดเรียบร้อย");
        }

        function getFilteredDishes() {
            return FOOD_DATABASE.filter(dish => {
                const matchMeat = selectedFilters.meat.includes('all') || selectedFilters.meat.includes(dish.meat);
                const matchCat = selectedFilters.category.includes('all') || selectedFilters.category.includes(dish.category);
                const matchSpicy = selectedFilters.spicy.includes('all') || selectedFilters.spicy.includes(dish.spicy);
                return matchMeat && matchCat && matchSpicy;
            });
        }

        function updateMatchCount() {
            const matches = getFilteredDishes();
            const badge = document.getElementById('matchCountBadge');
            badge.textContent = `มี ${matches.length} เมนู`;
        }

        function triggerSpinWheel() {
            if (isSpinning) return;

            const pool = getFilteredDishes();
            if (pool.length === 0) {
                showToast("ไม่พบเมนูตามเงื่อนไข ลองปรับตัวเลือกดูนะ");
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-70', 'cursor-not-allowed');

            const slotEmoji = document.getElementById('slotEmoji');
            const slotName = document.getElementById('slotName');
            const slotTags = document.getElementById('slotTags');
            const resultActions = document.getElementById('resultActions');
            const slotBox = document.getElementById('slotSection');

            resultActions.classList.add('hidden');
            slotBox.scrollIntoView({ behavior: 'smooth', block: 'center' });

            let speed = 40;
            let counter = 0;
            const maxIterations = 20 + Math.floor(Math.random() * 8);

            function rollCycle() {
                const randomItem = pool[Math.floor(Math.random() * pool.length)];
                slotEmoji.textContent = randomItem.emoji;
                slotName.textContent = randomItem.name;
                playTickSound();

                counter++;
                if (counter < maxIterations) {
                    speed += 5;
                    setTimeout(rollCycle, speed);
                } else {
                    const finalDish = pool[Math.floor(Math.random() * pool.length)];

                    slotEmoji.textContent = finalDish.emoji;
                    slotName.textContent = finalDish.name;
                    slotName.className = "text-xl sm:text-2xl font-extrabold font-kanit text-brand-yellow pulse-glow tracking-wide";
                    
                    let catText = 'กับข้าว';
                    if (finalDish.category === 'single') catText = 'จานเดียว';
                    else if (finalDish.category === 'noodle') catText = 'เมนูเส้น';

                    const spicyText = finalDish.spicy === 'spicy' ? 'เผ็ดแซ่บ' : 'ไม่เผ็ด';

                    let meatText = 'ทั่วไป';
                    if (finalDish.meat === 'pork') meatText = 'หมู';
                    else if (finalDish.meat === 'chicken') meatText = 'ไก่';
                    else if (finalDish.meat === 'beef') meatText = 'วัว';
                    else if (finalDish.meat === 'fish') meatText = 'ปลา';
                    else if (finalDish.meat === 'seafood') meatText = 'ทะเล';
                    else if (finalDish.meat === 'veggie') meatText = 'มังสวิรัติ';

                    slotTags.innerHTML = `
                        <span class="text-xs px-2.5 py-1 rounded-full bg-brand-red text-white font-medium">${meatText}</span>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-brand-yellow text-stone-900 font-medium">${catText}</span>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-brand-green text-white font-medium">${spicyText}</span>
                    `;

                    resultActions.classList.remove('hidden');
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-70', 'cursor-not-allowed');

                    showToast(`ได้เมนู: ${finalDish.name}`);
                }
            }

            rollCycle();
        }

        function surpriseMe() {
            resetFilters();
            setTimeout(() => {
                triggerSpinWheel();
            }, 50);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;

            clearTimeout(toastTimeout);
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateMatchCount();
        });
    </script>
